image: corsika/devel:u-18.04

variables:
  GIT_SSL_NO_VERIFY: "1"

build:
  stage: build
  tags:
    - corsika
  script:
    - mkdir build
    - cd build
    - cmake ..
    - cmake --build . -- -j4
    - UBSAN_OPTIONS=print_stacktrace=1
      LSAN_OPTIONS=verbosity=1:log_threads=1
      ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=1 ctest -V -O test.log
  artifacts:
    expire_in: 1 week
    paths:
      - build/test.log
    when: on_failure
    reports:
      junit:
        - build/test_outputs/junit*.xml

pages:
  stage: build
  tags:
    - corsika
  script:
    - mkdir build
    - cd build
    - cmake ..
    - make doxygen
    - mkdir .public
    - cp -r Documentation/Doxygen/html .public/
    - mv .public ../public
  artifacts:
    paths:
      - public
  only:
    - tags
    - triggers
    - schedules


