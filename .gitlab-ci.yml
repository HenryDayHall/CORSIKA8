####### INSTALL  ##############

##########################################################
# generic install template job
# make install
.install:
  stage: install
  tags:
    - corsika
  script:
    - cd build
    - set -o pipefail
    - make -j2 install
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      when: manual
  allow_failure: true
  cache:
    paths:
      - ${CI_PROJECT_DIR}/build/
    untracked: true
    policy: pull

# install for gcc
install-u-18_04:
  extends: .install
  image: corsika/devel:u-18.04
  dependencies:
    - build-u-18_04
  cache:
