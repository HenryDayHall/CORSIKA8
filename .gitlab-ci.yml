image: corsika/devel:u-18.04

variables:
  GIT_SSL_NO_VERIFY: "1"

build:
  stage: build
  tags:
    - corsika
  script:
    - mkdir build
    - cd build
    - cmake ..
    - cmake --build . -- -j 4 
    - ctest -V >& test.log
  after_script:
    - cd build
    - ls
    - gzip -v -9 -S .gz test.log
    - pwd
  artifacts:
    expire_in: 1 week
    paths:
      - build/test.log.gz
    when: on_failure
    reports:
      junit:
        - build/test_outputs/junit*.xml

pages:
  stage: build
  tags:
    - corsika
  script:
    - mkdir build
    - cd build
    - cmake ..
    - make doxygen
    - mkdir .public
    - cp -r Documentation/Doxygen/html .public/
    - mv .public ../public
  artifacts:
    paths:
      - public
  only:
    - tags
    - triggers
    - schedules


