  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - ${CI_PROJECT_DIR}/build/examples.log.gz
  cache:
    paths:
      - ${CI_PROJECT_DIR}/build/
    untracked: true
    policy: pull

# example for gcc
