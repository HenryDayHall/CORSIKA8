image: ubuntu:bionic

variables:
  GIT_SSL_NO_VERIFY: "1"

before_script:
  - apt-get update --yes
  - apt-get install --yes cmake libboost-dev libeigen3-dev python3 gfortran
  - apt-get install --yes doxygen graphviz

build:
  stage: build
  tags:
    - corsika
  script:
    - mkdir build
    - cd build
    - cmake ..
    - cmake --build .
    - ctest -j4 -V >& test.log
    - gzip -9 test.log
  artifacts:
    paths:
      - build/test.log.gz
    when: on_failure
    reports:
      junit:
        - build/test_outputs/junit*.xml

pages:
  stage: build
  tags:
    - corsika
  script:
    - mkdir build
    - cd build
    - cmake ..
    - make doxygen
    - mkdir .public
    - cp -r Documentation/Doxygen/html .public/
    - mv .public ../public
  artifacts:
    paths:
      - public
  only:
    - tags
    - triggers
    - schedules


