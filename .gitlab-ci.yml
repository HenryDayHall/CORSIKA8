####### CONFIG ##############

##########################################################
# the generic config template job
# job/stage to just prepare cmake
.config:
  stage: config
  tags:
    - corsika
  script:
    - mkdir -p build
    - cd build
    - ../conan-install.sh
    - cmake .. -DCMAKE_INSTALL_PREFIX=$PWD/install -DCMAKE_BUILD_TYPE=Debug -DUSE_Pythia8_C8=C8
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths:
      - ${CI_PROJECT_DIR}/build/CMakeFiles/CMakeOutput.log

# config for gcc
config-u-22_04:
  extends: .config
  image: corsika/devel:u-22.04

# config for clang
config-clang-14:
  extends: .config
  image: corsika/devel:clang-14



####### BUILD-TEST (all builds <= Draft/WIP, default) ##############

##########################################################
# the generic build_test template job
# normal pipeline for each commit
.build_test:
  stage: build_test
  tags:
    - corsika
  script:
    - mkdir -p build
    - cd build
    - ../conan-install.sh
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DUSE_Pythia8_C8=C8
    - cmake --build . -- -j4
    - set -o pipefail
    - ctest -j4 
  rules:
    - if: '$CI_MERGE_REQUEST_ID && ($CI_MERGE_REQUEST_TITLE =~ /^Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /^WIP:/)'
      allow_failure: false
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - ${CI_PROJECT_DIR}/build/test_outputs/junit*.xml
    reports:
      junit:
        - ${CI_PROJECT_DIR}/build/test_outputs/junit*.xml

# build_test for gcc
build_test-u-22_04:
  extends: .build_test
  image: corsika/devel:u-22.04
  needs:
    - job: config-u-22_04
      artifacts: false

# build_test for clang
build_test-clang-14:
  extends: .build_test
  image: corsika/devel:clang-14
  needs:
    - job: config-clang-14
      artifacts: false


####### BUILD-TEST-EXAMPLE (only non-Draft/non-WIP)  ##############

##########################################################
# generic example template job
# normal pipeline for each commit
.build_test_example:
  stage: build_test_example
  tags:
    - corsika
  script:
    - mkdir -p build
    - cd build
    - ../conan-install.sh
    - cmake .. -DCMAKE_INSTALL_PREFIX=$PWD/install -DCMAKE_BUILD_TYPE=Debug -DUSE_Pythia8_C8=C8
    - cmake --build . -- VERBOSE=1 -j4
    - set -o pipefail
    - ctest -j4
    - cmake --install .
    - mkdir -p build_examples
    - cd build_examples
    - cmake -DCMAKE_BUILD_TYPE=Debug ../install/share/corsika/examples
    - cmake --build . -- -j2
    - cmake --build . --target run_examples -- -j2 
  rules:
    - if: '$CI_MERGE_REQUEST_ID && ($CI_MERGE_REQUEST_TITLE =~ /^Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /^WIP:/)'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 3 days
    reports:
      junit:
        - ${CI_PROJECT_DIR}/build/test_outputs/junit*.xml
    paths:
      - ${CI_PROJECT_DIR}/build/build_examples/example_outputs #python tests need this
      - ${CI_PROJECT_DIR}/build/test_outputs/junit*.xml
      - ${CI_PROJECT_DIR}/build/CMakeCache.txt #python tests need this
      - ${CI_PROJECT_DIR}/build/bin #python tests need this

# build_test_example for gcc
build_test_example-u-22_04:
  extends: .build_test_example
  image: corsika/devel:u-22.04
  needs:
    - job: config-u-22_04
      artifacts: false


# build_test_example for clang
build_test_example-clang-14:
  extends: .build_test_example
  image: corsika/devel:clang-14
  needs:
    - job: config-clang-14
      artifacts: false


####### OPTIONAL ##############

##########################################################
# generic release template job
# optional release pipeline for each commit
.release:
  stage: optional
  tags:
    - corsika
  script:
    - mkdir -p build
    - cd build
    - ../conan-install.sh
    - cmake .. -DCMAKE_INSTALL_PREFIX=$PWD/install -DCMAKE_BUILD_TYPE=Release -DUSE_Pythia8_C8=C8
    - cmake --build . -- -j4
    - set -o pipefail
    - ctest -j4
    - cmake --install .
    - mkdir -p build_examples
    - cd build_examples
    - cmake -DCMAKE_BUILD_TYPE=Release ../install/share/corsika/examples
    - cmake --build . -- VERBOSE=1 -j2
    - cmake --build . --target run_examples -- -j2 
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for Code Review/' # run on merge requests, if label 'Ready for Code Review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 3 days
    reports:
      junit:
        - ${CI_PROJECT_DIR}/build/test_outputs/junit*.xml
    paths:
      - ${CI_PROJECT_DIR}/build/test_outputs/junit*.xml

# release for gcc
release-full-u-22_04:
  extends: .release
  image: corsika/devel:u-22.04
  needs:
    - job: config-u-22_04
      artifacts: false

# release for clang
release-full-clang-14:
  extends: .release
  image: corsika/devel:clang-14
  needs:
    - job: config-clang-14
      artifacts: false


###### COVERAGE ##########

##########################################################
# the coverage generation should either run when manually requested, OR always on the master

coverage:
  image: corsika/devel:u-22.04
  needs:
    - job: config-u-22_04
      artifacts: false
  stage: optional
  tags:
    - corsika
  script:
    - mkdir -p build
    - cd build
    - ../conan-install.sh
    - cmake .. -DCMAKE_BUILD_TYPE=Coverage -DUSE_Pythia8_C8=C8
    - cmake --build . -- -j4
    - ctest -j4 
    - cmake --build . --target coverage
    - tar czf coverage-report.tar.gz coverage-report
  coverage: '/^.*lines\.+:\s(.*\%)\s/'
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for Code Review/' # run on merge requests, if label 'Ready for Code Review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 3 month
    paths:
      - ${CI_PROJECT_DIR}/build/coverage-report.tar.gz





######  SANITY ##########

##########################################################
sanity:
  image: corsika/devel:u-22.04
  needs:
    - job: config-u-22_04
      artifacts: false

  stage: optional
  tags:
    - corsika
  script:
    - mkdir -p build
    - cd build
    - ../conan-install.sh
    - cmake .. -DWITH_CORSIKA_SANITIZERS_ENABLED=ON -DCMAKE_BUILD_TYPE=Debug -DUSE_Pythia8_C8=C8
    - cmake --build . -- -j4
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for Code Review/' # run on merge requests, if label 'Ready for Code Review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true


######  Python ##########

##########################################################
# template for all Python jobs
.python:
  stage: python
  tags:
    - corsika
  script:
    - cd ${CI_PROJECT_DIR}/python  # change into the Python directory
    - pip3 install --user -e '.[test]'  # install the package + test deps
    - python3 --version
    - python3 -m mypy corsika
    - python3 -m isort --atomic --check-only corsika tests
    - python3 -m black -t py37 corsika tests
    - python3 -m flake8 corsika tests
    - python3 -m pytest --cov=corsika tests
  coverage: '/^TOTAL\s*\d+\s*\d+\s*(.*\%)/'

python-tests:
  extends: .python
  image: corsika/devel:u-22.04
  needs:
    - job: build_test_example-u-22_04
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - ${CI_PROJECT_DIR}/python/python-test.log
  allow_failure: false
