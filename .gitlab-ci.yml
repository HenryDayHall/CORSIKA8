image: ubuntu:bionic

variables:
  GIT_SSL_NO_VERIFY: "1"

before_script:
  - apt-get update --yes
  - apt-get install --yes cmake libboost-dev libeigen3-dev python3 gfortran

build:
  stage: build
  tags:
    - run1
  script:
    - mkdir build
    - cd build
    - cmake ..
    - cmake --build .
    - ctest -V
