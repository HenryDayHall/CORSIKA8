variables:
  GIT_SSL_NO_VERIFY: "1"
  GIT_DEPTH: 10
  ## Runtime options for sanitizers
  # (detect_leaks=0 because leak detection doesn't work in CI, but you can
  # try to test with leak detection locally by using detect_leaks=1)
  UBSAN_OPTIONS: "print_stacktrace=1"
  LSAN_OPTIONS: "log_threads=1"
  ASAN_OPTIONS: "detect_leaks=0:detect_stack_use_after_return=1"

# normal multi-step pipeline for each commit
stages:
  - quality
  - config
  - build
  - test
  - example
  - install
  - optional


####### CODE QUALITY CHECK ##############

##########################################################
check-copyrights:
  image: corsika/devel:u-18.04
  stage: quality
  tags:
    - corsika
  script:
    - ./do-copyright.py
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

##########################################################
check-clang-format:
  image: corsika/devel:u-18.04
  before_script:
  - apt-get update && apt-get install -y -qq clang-format
  stage: quality
  tags:
    - corsika
  script:
    - ./do-clang-format.py --all
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true



####### CONFIG ##############

##########################################################
# the generic config template job
# job/stage to just prepare cmake
.config:
  stage: config
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - mkdir build
    - cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DWITH_PYTHIA=ON
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache: 
    paths:
      - build/
    policy: pull-push

# config for gcc
config-u-18_04:
  extends: .config
  image: corsika/devel:u-18.04
  cache:
    key: "${CI_COMMIT_REF_SLUG}-gcc"

# config for clang
config-clang-8:
  extends: .config
  image: corsika/devel:clang-8
  cache:
    key: "${CI_COMMIT_REF_SLUG}-clang"



####### BUILD  ##############

##########################################################
# the generic build template job
# normal pipeline for each commit
.build:
  stage: build
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - cd build
    - cmake --build . -- -j4
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache: 
    paths:
      - build/
    policy: pull-push

# build for gcc
build-u-18_04:
  extends: .build
  image: corsika/devel:u-18.04
  dependencies:
    - config-u-18_04
  cache:
    key: "${CI_COMMIT_REF_SLUG}-gcc"

# build for clang
build-clang-8: 
  extends: .build
  image: corsika/devel:clang-8
  dependencies:
    - config-clang-8
  cache:
    key: "${CI_COMMIT_REF_SLUG}-clang"


####### TEST  ##############

##########################################################
# generic test template job
# normal pipeline for each commit
.test:
  stage: test
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - git clone https://gitlab.ikp.kit.edu/AirShowerPhysics/corsika-data.git
    - cd build
    - set -o pipefail
    - ctest -VV | gzip -v -9 > test.log.gz 
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    when: always
    expire_in: 3 days
    reports:
      junit:
        - build/test_outputs/junit*.xml
    paths:
      - build/test.log.gz
  cache: 
    paths:
      - build/
    policy: pull

# test for gcc
test-u-18_04:
  extends: .test
  image: corsika/devel:u-18.04
  dependencies:
    - build-u-18_04
  cache:
    key: "${CI_COMMIT_REF_SLUG}-gcc"

# test for clang
test-clang-8:
  extends: .test
  image: corsika/devel:clang-8
  dependencies:
    - build-clang-8
  cache:
    key: "${CI_COMMIT_REF_SLUG}-clang"



####### EXAMPLE  ##############

##########################################################
# generic example template job
# normal pipeline for each commit
.example:
  stage: example
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - git clone https://gitlab.ikp.kit.edu/AirShowerPhysics/corsika-data.git
    - cd build
    - set -o pipefail
    - make run_examples | gzip -v -9 > examples.log.gz
  rules:
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^WIP:/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - build/examples.log.gz
  cache: 
    paths:
      - build/
    policy: pull

# example for gcc
example-u-18_04: 
  extends: .example
  image: corsika/devel:u-18.04
  dependencies:
    - build-u-18_04
  cache:
    key: "${CI_COMMIT_REF_SLUG}-gcc"

# example for clang
example-clang-8:
  extends: .example
  image: corsika/devel:clang-8
  dependencies:
    - build-clang-8
  cache:
    key: "${CI_COMMIT_REF_SLUG}-clang"


####### INSTALL  ##############

##########################################################
# generic install template job
# make install
.install:
  stage: install
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - cd build
    - set -o pipefail
    - make install
  rules:
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^WIP:/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  cache: 
    paths:
      - build/
    policy: pull

# install for gcc
install-u-18_04: 
  extends: .install
  image: corsika/devel:u-18.04
  dependencies:
    - build-u-18_04
  cache:
    key: "${CI_COMMIT_REF_SLUG}-gcc"

# install for clang
install-clang-8:
  extends: .install
  image: corsika/devel:clang-8
  dependencies:
    - build-clang-8
  cache:
    key: "${CI_COMMIT_REF_SLUG}-clang"



####### OPTIONAL ##############

##########################################################
# generic release template job
# optional release pipeline for each commit
.release:
  stage: optional
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - git clone https://gitlab.ikp.kit.edu/AirShowerPhysics/corsika-data.git
    - cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Release
    - cmake --build . -- -j4
    - set -o pipefail
    - ctest -VV | gzip -v -9 > test.log.gz 
    - make run_examples
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for code review/' # run on merge requests, if label 'Ready for code review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  cache: 
    paths:
      - build/
    policy: pull
  artifacts:
    when: always
    expire_in: 3 days
    reports:
      junit:
        - build/test_outputs/junit*.xml
    paths:
      - build/test.log.gz

# release for gcc
release-full-u-18_04:
  extends: .release
  image: corsika/devel:u-18.04
  dependencies:
    - config-u-18_04
  cache:
    key: "${CI_COMMIT_REF_SLUG}-gcc"

# release for clang
release-full-clang-8: 
  extends: .release
  image: corsika/devel:clang-8
  dependencies:
    - config-clang-8
  cache:
    key: "${CI_COMMIT_REF_SLUG}-clang"


##########################################################
# the coverage generation should either run when manually requested, OR always on the master
coverage:
  image: corsika/devel:u-18.04
  dependencies:
    - config-u-18_04
  stage: optional
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Coverage
    - cmake --build . -- -j4
    - ctest -j4 -V > test.log 
    - cmake --build . --target coverage
    - tar czf coverage-report.tar.gz coverage-report
  coverage: '/^.*functions\.+:\s(.*\%)\s/'
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for code review/' # run on merge requests, if label 'Ready for code review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  artifacts:
    expire_in: 1 year
    paths:
      - build/coverage-report.tar.gz
  cache: 
    paths:
      - build/
    policy: pull
    key: "${CI_COMMIT_REF_SLUG}-gcc"


##########################################################
documentation:
  image: corsika/devel:u-18.04
  dependencies:
    - config-u-18_04
  stage: optional
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - cd build
    - cmake --build . --target doxygen -- -j4
    - mkdir .public
    - cp -r Documentation/Doxygen/html .public/
    - mv .public ../public
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for code review/' # run on merge requests, if label 'Ready for code review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  artifacts:
    expire_in: 3 weeks
    paths:
      - public
  cache: 
    paths:
      - build/
    policy: pull
    key: "${CI_COMMIT_REF_SLUG}-gcc"


##########################################################
sanity:
  image: corsika/devel:u-18.04
  dependencies:
    - config-u-18_04
  stage: optional
  tags:
    - corsika
  variables:
    CORSIKA_DATA: "${CI_PROJECT_DIR}/corsika-data/"
  script:
    - cd build
    - cmake .. -DWITH_CORSIKA_SANITIZERS_ENABLED=ON
    - cmake --build . -- -j4
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for code review/' # run on merge requests, if label 'Ready for code review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  cache: 
    paths:
      - build/
    policy: pull
    key: "${CI_COMMIT_REF_SLUG}-gcc"
