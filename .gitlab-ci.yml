##########################################################
# the coverage generation should either run when manually requested, OR always on the master

coverage:
  image: corsika/devel:u-18.04
  dependencies:
    - config-u-18_04
  stage: optional
  tags:
    - corsika
  script:
    - cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Coverage
    - cmake --build . -- -j4
    - ctest -j4 -VV | gzip -v -9 > test.log.gz 
    - cmake --build . --target coverage
    - tar czf coverage-report.tar.gz coverage-report
  coverage: '/^.*functions\.+:\s(.*\%)\s/'
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for code review/' # run on merge requests, if label 'Ready for code review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - ${CI_PROJECT_DIR}/build/test.log.gz
      - ${CI_PROJECT_DIR}/build/coverage-report.tar.gz
  cache: 
    paths:
      - ${CI_PROJECT_DIR}/build/
      - ${CI_PROJECT_DIR}/Data/
    untracked: true
    policy: pull
    key: "${CI_COMMIT_REF_SLUG}-gcc"




##########################################################
documentation:
  image: corsika/devel:u-18.04
  dependencies:
    - config-u-18_04
  stage: optional
  tags:
    - corsika
  script:
    - cd build
    - cmake --build . --target doxygen -- -j4
    - mkdir -p .public
    - cp -r Documentation/Doxygen/html .public/
    - mv .public ../public
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for code review/' # run on merge requests, if label 'Ready for code review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  artifacts:
    expire_in: 3 weeks
    paths:
      - ${CI_PROJECT_DIR}/public
  cache: 
    paths:
      - ${CI_PROJECT_DIR}/build/
      - ${CI_PROJECT_DIR}/Data/
    untracked: true
    policy: pull
    key: "${CI_COMMIT_REF_SLUG}-gcc"



##########################################################
sanity:
  image: corsika/devel:u-18.04
  dependencies:
    - config-u-18_04
  stage: optional
  tags:
    - corsika
  script:
    - cd build
    - cmake .. -DWITH_CORSIKA_SANITIZERS_ENABLED=ON
    - cmake --build . -- -j4
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /Ready for code review/' # run on merge requests, if label 'Ready for code review' is set
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  cache: 
    paths:
      - ${CI_PROJECT_DIR}/build/
      - ${CI_PROJECT_DIR}/Data/
    untracked: true
    policy: pull
    key: "${CI_COMMIT_REF_SLUG}-gcc"
